name: dgcytof
# Upstream 1.0.0 pins Python-3.8-era scientific packages. These newer pins are
# the compatible versions validated for this benchmark; pkg_resources remains
# required by the unmodified vendored package.
channels:
  - conda-forge
  - nodefaults
dependencies:
  - conda-forge::python=3.11
  - conda-forge::numpy=1.23.5
  - conda-forge::scipy=1.10.1
  - conda-forge::pandas=1.5.3
  - conda-forge::matplotlib=3.7.2
  - conda-forge::seaborn=0.12.2
  - conda-forge::umap-learn=0.5.5
  - conda-forge::hdbscan=0.8.33
  - conda-forge::hdmedians
  - conda-forge::scikit-learn=1.2.2
  - conda-forge::scikit-plot=0.3.7
  - conda-forge::scikit-bio=0.5.8
  - conda-forge::tensorboard=2.13.0
  - conda-forge::isodate
  - conda-forge::pydantic
  - conda-forge::pyyaml
  - conda-forge::pip
  - conda-forge::setuptools<81
  - pip:
      - "torch==2.0.1"
      - "torchvision==0.15.2"
