    - values:
      - --dataset_name
      - FR-FCM-ZY34
      - --dataset-revision
      - 67990f383ac8f169c9a00148febba1ed357e18e8
      - --seed
      - '42'
      - --transformation-cofactor
      - '150'
      - --potential-batches
      - '1'
      - --name
      - data_import.data_raw
    - values:
      - --dataset_name
      - FR-FCM-ZYVT
      - --dataset-revision
      - 67990f383ac8f169c9a00148febba1ed357e18e8
      - --seed
      - '42'
      - --transformation-cofactor
      - '150'
      - --potential-batches
      - '1'
      - --name
      - data_import.data_raw
    - values:
      - --dataset_name
      - '15723074'
      - --dataset-revision
      - 67990f383ac8f169c9a00148febba1ed357e18e8
      - --seed
      - '42'
      - --potential-batches
      - '1'
      - --name
      - data_import.data_raw
    - values:
      - --dataset_name
      - FR-FCM-Z2KP-healthy
      - --dataset-revision
      - 67990f383ac8f169c9a00148febba1ed357e18e8
      - --seed
      - '420'
      - --sub-sampling
      - '1000'
      - --transformation-cofactor
      - '150'
      - --potential-batches
      - '1'
      - --name
      - data_import.data_raw
    - values:
      - --dataset_name
      - FR-FCM-Z2KP-healthy
      - --dataset-revision
      - 67990f383ac8f169c9a00148febba1ed357e18e8
      - --seed
      - '420'
      - --sub-sampling
      - '5000'
      - --transformation-cofactor
      - '150'
      - --potential-batches
      - '1'
      - --name
      - data_import.data_raw
    - values:
      - --dataset_name
      - FR-FCM-Z2KP-healthy
      - --dataset-revision
      - 67990f383ac8f169c9a00148febba1ed357e18e8
      - --seed
      - '420'
      - --sub-sampling
      - '10000'
      - --transformation-cofactor
      - '150'
      - --potential-batches
      - '1'
      - --name
      - data_import.data_raw
    - values:
      - --dataset_name
      - FR-FCM-Z2KP-healthy
      - --dataset-revision
      - 67990f383ac8f169c9a00148febba1ed357e18e8
      - --seed
      - '420'
      - --sub-sampling
      - '50000'
      - --transformation-cofactor
      - '150'
      - --potential-batches
      - '1'
      - --name
      - data_import.data_raw
    - values:
      - --dataset_name
      - FR-FCM-Z2KP-healthy
      - --dataset-revision
      - 67990f383ac8f169c9a00148febba1ed357e18e8
      - --seed
      - '420'
      - --sub-sampling
      - '100000'
      - --transformation-cofactor
      - '150'
      - --potential-batches
      - '1'
      - --name
      - data_import.data_raw
  outputs:
  - id: data.raw
    path: '{input}/{stage}/{module}/{params}/data_raw.data.tar.gz'
  - id: data.import_metadata
    path: '{input}/{stage}/{module}/{params}/{dataset}.data_raw.metadata.json.gz'
- id: preprocessing
  modules:
  - id: data_preprocessing
    name: Data preprocessing for CyTOF datasets
    software_environment: py
    repository:
      url: https://github.com/kaae-2/ob-pipeline-preprocessing
      commit: fc4c40812bda81b818af449c0ba8bbfa2a911e20
    parameters:
    - values:
      - --num
      - '1'
      - --max-workers
      - '8'
      - --name
      - data_import.data_preprocessing
    - values:
      - --num
      - '2'
      - --max-workers
      - '8'
      - --name
      - data_import.data_preprocessing
    - values:
      - --num
      - '3'
      - --max-workers
      - '8'
      - --name
      - data_import.data_preprocessing
    - values:
      - --num
      - '4'
      - --max-workers
      - '8'
      - --name
      - data_import.data_preprocessing
    - values:
      - --num
      - '5'
      - --max-workers
      - '8'
      - --name
      - data_import.data_preprocessing
  inputs:
  - entries:
    - data.raw
    - data.import_metadata
  outputs:
  - id: data.pre_train_matrix
    path: '{input}/{stage}/{module}/{params}/data_preprocessing.train.matrix.tar.gz'
  - id: data.pre_train_labels
    path: '{input}/{stage}/{module}/{params}/data_preprocessing.train.labels.tar.gz'
  - id: data.pre_test_matrix
    path: '{input}/{stage}/{module}/{params}/data_preprocessing.test.matrices.tar.gz'
  - id: data.pre_true_labels
    path: '{input}/{stage}/{module}/{params}/data_preprocessing.test.labels.tar.gz'
  - id: data.pre_metadata
    path: '{input}/{stage}/{module}/{params}/{dataset}.data_preprocessing.metadata.json.gz'
  - id: data.pre_split_audit
    path: '{input}/{stage}/{module}/{params}/{dataset}.data_preprocessing.split_audit.json.gz'
- id: stratify
  modules:
  - id: data_stratify
    name: Stratify preprocessed CyTOF datasets
    software_environment: py
    repository:
      url: https://github.com/kaae-2/ob-stratify.git
      commit: 6bc6418d97572d217f269f842f9dfa1e5a452658
    parameters:
    - values:
      - --drop-ungated-training
      - 'false'
      - --drop-ungated-test
      - 'false'
    - values:
      - --drop-ungated-training
      - 'true'
      - --drop-ungated-test
      - 'false'
    - values:
      - --drop-ungated-training
      - 'true'
      - --drop-ungated-test
      - 'true'
  inputs:
  - entries:
    - data.pre_train_matrix
    - data.pre_train_labels
    - data.pre_test_matrix
    - data.pre_true_labels
    - data.pre_metadata
  outputs:
  - id: data.train_matrix
    path: '{input}/{stage}/{module}/{params}/{dataset}.train.matrix.tar.gz'
  - id: data.train_labels
    path: '{input}/{stage}/{module}/{params}/{dataset}.train.labels.tar.gz'
  - id: data.test_matrix
    path: '{input}/{stage}/{module}/{params}/{dataset}.test.matrices.tar.gz'
  - id: data.true_labels
    path: '{input}/{stage}/{module}/{params}/{dataset}.test.labels.tar.gz'
  - id: data.metadata
    path: '{input}/{stage}/{module}/{params}/{dataset}.metadata.json.gz'
  - id: data.split_audit
    path: '{input}/{stage}/{module}/{params}/{dataset}.split_audit.json.gz'
- id: analysis
  inputs:
  - entries:
    - data.train_matrix
    - data.train_labels
    - data.test_matrix
    - data.metadata
  modules:
  - id: dgcytof
    name: DGCyTOF
    software_environment: dgcytof
    repository:
      url: https://github.com/kaae-2/ob-pipeline-dgcytof
      commit: 03892d71e267f98f922ab8020af1e9c3b4e23e24
    parameters:
    - values:
      - --seed
      - '42'
  - id: cygate
    name: CyGATE
    software_environment: bash
    repository:
      url: https://github.com/kaae-2/ob-pipeline-CyGATE
      commit: 1760ecd421628254999e5761f8689c12be37eb75
  - id: random
    name: Random
    software_environment: cran
    repository:
      url: https://github.com/kaae-2/ob-pipeline-random
      commit: 8c084c4674fd8043de65ea65cc0350db89498766
    parameters: []
  - id: cyanno
    name: CyAnno
    software_environment: cyanno
    repository:
      url: https://github.com/kaae-2/ob-pipeline-cyanno
      commit: d8b0eb5b27539f76199952ecb91a123b890ef9c9
    parameters: []
  - id: knn
    name: KNN
    software_environment: py
    repository:
      url: https://github.com/kaae-2/ob-pipeline-knn
      commit: 60af71d18994839220e8b3d5828fb839a3157358
    parameters: []
  - id: lda
    name: LDA
    software_environment: cran
    repository:
      url: https://github.com/kaae-2/ob-pipeline-LDA
      commit: 33b3c94dda212acda1ed09601e38ee37e512e236
    parameters: []
  outputs:
  - id: analysis.prediction
    path: '{input}/{stage}/{module}/{params}/{dataset}_predicted_labels.tar.gz'
- id: metrics
  modules:
  - id: flow_metrics
    name: benchmark metrics for flow/cytof data
    software_environment: py
    repository:
      url: https://github.com/kaae-2/ob-pipeline-metrics
      commit: 6ce3ed1d5fd9ce5663d1b9c962ce215cb1452ff1
    parameters:
    - values:
      - --metric
      - accuracy,precision,recall,balanced_accuracy,f1
  inputs:
  - entries:
    - analysis.prediction
    - data.true_labels
    - data.metadata
  outputs:
  - id: metrics.scores
    path: '{input}/{stage}/{module}/{params}/{dataset}.flow_metrics.json.gz'
