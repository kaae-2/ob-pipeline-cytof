id: cytof_benchmmark_exercise
description: Final reviewer benchmark; GateMeClass is reported from frozen partial evidence only.
version: 0.3
benchmarker: Andrea Sonnenholzner, Frederik Kirk, Helene Wegener, Javier Herranz
storage: http://omnibenchmark.org:9000
benchmark_yaml_spec: 0.04
storage_api: S3
storage_bucket_name: clusteringexampleconda
software_backend: conda
software_environments:
  py:
    description: clustbench on py3.12.6
    conda: envs/py.yml
    envmodule: py
  py-old:
    description: clustbench on py3.12.6
    conda: envs/py-old.yml
    envmodule: py-old
  cran:
    description: CRAN R environment
    conda: envs/cran.yml
    envmodule: cran
  cran-hw:
    description: CRAN-hw R environment
    conda: envs/cran-hw.yml
    envmodule: cran-hw
  cyanno:
    description: CyAnno module environment
    conda: envs/cyanno_env.yml
    envmodule: cyanno
  dgcytof:
    description: DG-CyTOF legacy environment
    conda: envs/dgcytof.yml
    envmodule: dgcytof
  deepcytof:
    description: Deepcytof environment
    conda: envs/deepcytof.yml
    envmodule: deepcytof
  cydefine:
    description: cyDefine environment
    conda: envs/cydefine.yml
    envmodule: cydefine
  bash:
    description: Bash environment
    conda: envs/bash.yml
    envmodule: bash
  metrics_r:
    description: Metrics collector R environment
    conda: envs/metrics_r.yml
    envmodule: metrics_r
metric_collectors:
- id: metrics_report
  name: Metrics report collector
  software_environment: metrics_r
  repository:
    url: https://github.com/kaae-2/ob-metrics-collectors.git
    commit: 116369c449904ce5c81e75a07ec29fcb8c601a6d
  inputs:
  - metrics.scores
  - data.metadata
  outputs:
  - id: metrics.report
    path: '{input}/metric_collectors/metrics_report/metrics_report.html'
  - id: metrics.plots
    path: '{input}/metric_collectors/metrics_report/metric_plots.tar.gz'
stages:
- id: data
  modules:
  - id: data_import
    name: Prepared CyTOF CSV dataset from GitHub prepared folder
    software_environment: py
    repository:
      url: https://github.com/kaae-2/ob-pipeline-data
      commit: aa29254bd4c5541521a1e1f95359fcaf31cd56aa
    parameters:
    - values:
      - --dataset_name
      - FR-FCM-Z2KP-healthy
      - --seed
      - '42'
      - --transformation-cofactor
      - '150'
      - --potential-batches
      - '1'
      - --name
      - data_import.data_raw
    - values:
      - --dataset_name
      - FR-FCM-Z2KP-covid
      - --seed
      - '42'
      - --transformation-cofactor
      - '150'
      - --potential-batches
      - '1'
      - --name
      - data_import.data_raw
    - values:
      - --dataset_name
      - FR-FCM-Z238
      - --seed
      - '42'
      - --transformation-cofactor
      - '5'
      - --potential-batches
      - '1'
      - --name
      - data_import.data_raw
    - values:
      - --dataset_name
      - FR-FCM-Z3YR
      - --seed
      - '42'
      - --transformation-cofactor
      - '5'
      - --potential-batches
      - '1'
      - --name
      - data_import.data_raw
    - values:
      - --dataset_name
      - Samusik
      - --seed
      - '42'
      - --transformation-cofactor
      - '5'
      - --potential-batches
      - '1'
      - --name
      - data_import.data_raw
    - values:
      - --dataset_name
      - BodenmillerXL
      - --seed
      - '42'
      - --transformation-cofactor
      - '5'
      - --potential-batches
      - '1'
      - --name
      - data_import.data_raw
    - values:
      - --dataset_name
      - Levine
      - --seed
      - '42'
      - --transformation-cofactor
      - '5'
      - --potential-batches
      - '1'
      - --name
      - data_import.data_raw
    - values:
      - --dataset_name
      - FlowCyt
      - --seed
      - '42'
      - --transformation-cofactor
      - '150'
      - --potential-batches
      - '1'
      - --name
      - data_import.data_raw
    - values:
      - --dataset_name
      - FR-FCM-ZY34
      - --seed
      - '42'
      - --transformation-cofactor
      - '150'
      - --potential-batches
      - '1'
      - --name
      - data_import.data_raw
    - values:
      - --dataset_name
      - FR-FCM-ZYVT
      - --seed
      - '42'
      - --transformation-cofactor
      - '150'
      - --potential-batches
      - '1'
      - --name
      - data_import.data_raw
    - values:
      - --dataset_name
      - '15723074'
      - --seed
      - '42'
      - --potential-batches
      - '1'
      - --name
      - data_import.data_raw
    - values:
      - --dataset_name
      - FR-FCM-Z2KP-healthy
      - --seed
      - '420'
      - --sub-sampling
      - '1000'
      - --transformation-cofactor
      - '150'
      - --potential-batches
      - '1'
      - --name
      - data_import.data_raw
    - values:
      - --dataset_name
      - FR-FCM-Z2KP-healthy
      - --seed
      - '420'
      - --sub-sampling
      - '5000'
      - --transformation-cofactor
      - '150'
      - --potential-batches
      - '1'
      - --name
      - data_import.data_raw
    - values:
      - --dataset_name
      - FR-FCM-Z2KP-healthy
      - --seed
      - '420'
      - --sub-sampling
      - '10000'
      - --transformation-cofactor
      - '150'
      - --potential-batches
      - '1'
      - --name
      - data_import.data_raw
    - values:
      - --dataset_name
      - FR-FCM-Z2KP-healthy
      - --seed
      - '420'
      - --sub-sampling
      - '50000'
      - --transformation-cofactor
      - '150'
      - --potential-batches
      - '1'
      - --name
      - data_import.data_raw
    - values:
      - --dataset_name
      - FR-FCM-Z2KP-healthy
      - --seed
      - '420'
      - --sub-sampling
      - '100000'
      - --transformation-cofactor
      - '150'
      - --potential-batches
      - '1'
      - --name
      - data_import.data_raw
  outputs:
  - id: data.raw
    path: '{input}/{stage}/{module}/{params}/data_raw.data.tar.gz'
  - id: data.import_metadata
    path: '{input}/{stage}/{module}/{params}/{dataset}.data_raw.metadata.json.gz'
- id: preprocessing
  modules:
  - id: data_preprocessing
    name: Data preprocessing for CyTOF datasets
    software_environment: py
    repository:
      url: https://github.com/kaae-2/ob-pipeline-preprocessing
      commit: 7ef034f394ce78ec2cc204ece4fcf1c9b35cb098
    parameters:
    - values:
      - --num
      - '1'
      - --max-workers
      - '8'
      - --name
      - data_import.data_preprocessing
    - values:
      - --num
      - '2'
      - --max-workers
      - '8'
      - --name
      - data_import.data_preprocessing
    - values:
      - --num
      - '3'
      - --max-workers
      - '8'
      - --name
      - data_import.data_preprocessing
    - values:
      - --num
      - '4'
      - --max-workers
      - '8'
      - --name
      - data_import.data_preprocessing
    - values:
      - --num
      - '5'
      - --max-workers
      - '8'
      - --name
      - data_import.data_preprocessing
  inputs:
  - entries:
    - data.raw
    - data.import_metadata
  outputs:
  - id: data.pre_train_matrix
    path: '{input}/{stage}/{module}/{params}/data_preprocessing.train.matrix.tar.gz'
  - id: data.pre_train_labels
    path: '{input}/{stage}/{module}/{params}/data_preprocessing.train.labels.tar.gz'
  - id: data.pre_test_matrix
    path: '{input}/{stage}/{module}/{params}/data_preprocessing.test.matrices.tar.gz'
  - id: data.pre_true_labels
    path: '{input}/{stage}/{module}/{params}/data_preprocessing.test.labels.tar.gz'
  - id: data.pre_metadata
    path: '{input}/{stage}/{module}/{params}/{dataset}.data_preprocessing.metadata.json.gz'
- id: stratify
  modules:
  - id: data_stratify
    name: Stratify preprocessed CyTOF datasets
    software_environment: py
    repository:
      url: https://github.com/kaae-2/ob-stratify.git
      commit: 85ad6485f3fb4395a19502f479ad7476923d790a
    parameters:
    - values:
      - --drop-ungated-training
      - 'false'
      - --drop-ungated-test
      - 'false'
    - values:
      - --drop-ungated-training
      - 'true'
      - --drop-ungated-test
      - 'false'
    - values:
      - --drop-ungated-training
      - 'true'
      - --drop-ungated-test
      - 'true'
  inputs:
  - entries:
    - data.pre_train_matrix
    - data.pre_train_labels
    - data.pre_test_matrix
    - data.pre_true_labels
    - data.pre_metadata
  outputs:
  - id: data.train_matrix
    path: '{input}/{stage}/{module}/{params}/{dataset}.train.matrix.tar.gz'
  - id: data.train_labels
    path: '{input}/{stage}/{module}/{params}/{dataset}.train.labels.tar.gz'
  - id: data.test_matrix
    path: '{input}/{stage}/{module}/{params}/{dataset}.test.matrices.tar.gz'
  - id: data.true_labels
    path: '{input}/{stage}/{module}/{params}/{dataset}.test.labels.tar.gz'
  - id: data.metadata
    path: '{input}/{stage}/{module}/{params}/{dataset}.metadata.json.gz'
- id: analysis
  inputs:
  - entries:
    - data.train_matrix
    - data.train_labels
    - data.test_matrix
    - data.metadata
  modules:
  - id: dgcytof
    name: DGCyTOF
    software_environment: dgcytof
    repository:
      url: https://github.com/kaae-2/ob-pipeline-dgcytof
      commit: 94edd10af5037ab20ceb2a2024beefa09d3313b9
    parameters:
    - values:
      - --seed
      - '42'
  - id: cygate
    name: CyGATE
    software_environment: bash
    repository:
      url: https://github.com/kaae-2/ob-pipeline-CyGATE
      commit: 1760ecd421628254999e5761f8689c12be37eb75
  - id: random
    name: Random
    software_environment: cran
    repository:
      url: https://github.com/kaae-2/ob-pipeline-random
      commit: 8c084c4674fd8043de65ea65cc0350db89498766
    parameters: []
  - id: cyanno
    name: CyAnno
    software_environment: cyanno
    repository:
      url: https://github.com/kaae-2/ob-pipeline-cyanno
      commit: c7e0e07ddc5a446931aa6b32efa6e1e41670a980
    parameters: []
  - id: knn
    name: KNN
    software_environment: py
    repository:
      url: https://github.com/kaae-2/ob-pipeline-knn
      commit: 85350acd6ebc0c3630add03e07700abee4d9b0c7
    parameters: []
  - id: lda
    name: LDA
    software_environment: cran
    repository:
      url: https://github.com/kaae-2/ob-pipeline-LDA
      commit: 33b3c94dda212acda1ed09601e38ee37e512e236
    parameters: []
  outputs:
  - id: analysis.prediction
    path: '{input}/{stage}/{module}/{params}/{dataset}_predicted_labels.tar.gz'
- id: metrics
  modules:
  - id: flow_metrics
    name: benchmark metrics for flow/cytof data
    software_environment: py
    repository:
      url: https://github.com/kaae-2/ob-pipeline-metrics
      commit: 795246cf09ed95d4c3df916273f7cfc60b7f45b1
    parameters: []
  inputs:
  - entries:
    - analysis.prediction
    - data.true_labels
    - data.metadata
  outputs:
  - id: metrics.scores
    path: '{input}/{stage}/{module}/{params}/{dataset}.flow_metrics.json.gz'
