      - 67990f383ac8f169c9a00148febba1ed357e18e8
      - --seed
      - '42'
      - --transformation-cofactor
      - '5'
      - --potential-batches
      - '1'
      - --name
      - data_import.data_raw
    - values:
      - --dataset_name
      - BodenmillerXL
      - --dataset-revision
      - 67990f383ac8f169c9a00148febba1ed357e18e8
      - --seed
      - '42'
      - --transformation-cofactor
      - '5'
      - --potential-batches
      - '1'
      - --name
      - data_import.data_raw
    - values:
      - --dataset_name
      - Levine
      - --dataset-revision
      - 67990f383ac8f169c9a00148febba1ed357e18e8
      - --seed
      - '42'
      - --transformation-cofactor
      - '5'
      - --potential-batches
      - '1'
      - --name
      - data_import.data_raw
    - values:
      - --dataset_name
      - FlowCyt
      - --dataset-revision
      - 67990f383ac8f169c9a00148febba1ed357e18e8
      - --seed
      - '42'
